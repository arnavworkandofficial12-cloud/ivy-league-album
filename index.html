<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ivy League Photo Album</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <header>
        <h1>🎓 Ivy League Universities</h1>
        <p class="subtitle">Click any photo to expand · Use arrow keys to navigate</p>
    </header>

    <main>
        <section id="album-view"></section>
    </main>

    <section id="modal-view" class="hidden">
        <button id="close-btn" aria-label="Close">✕</button>
        <button id="prev-btn" aria-label="Previous">&#8592;</button>
        <button id="next-btn" aria-label="Next">&#8594;</button>
    </section>

</body>

</html>
